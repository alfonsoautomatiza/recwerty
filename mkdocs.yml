site_name: Manual RecWERTY
site_url: https://wertymsd.github.io/manual-recwerty
site_description: Manual de usuario de RecWERTY v3.2 — herramienta profesional de grabación de pantalla con efectos visuales, mejora de audio y personalización de marca.
site_author: Alfonso Martinez

copyright: Copyright &copy; 2026 Alfonso Martinez - RecWERTY

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - content.code.copy
    - content.tabs.link
  icon:
    logo: material/record-rec
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: .
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.betterem
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - i18n:
      docs_structure: folder
      languages:
        - locale: es
          default: true
          name: Español
          build: true
          nav:
            - Inicio: index.md
            - ¿Qué es RecWERTY?: que-es-recwerty.md
            - Instalación:
              - General: instalacion/index.md
              - Requisitos del sistema: instalacion/requisitos.md
              - Instalación: instalacion/instalacion.md
              - Primeros pasos: instalacion/primeros-pasos.md
            - Interfaz:
              - General: interfaz/index.md
              - Navegación: interfaz/navegacion.md
            - Captura:
              - General: captura/index.md
              - Grabación: captura/grabacion.md
            - Efectos:
              - General: efectos/index.md
              - Clic: efectos/click.md
              - Cursor: efectos/cursor.md
              - Partículas: efectos/particulas.md
              - Transiciones: efectos/transiciones.md
              - Sonidos de teclado: efectos/sonidos-teclado.md
            - Audio:
              - General: audio/index.md
              - Mejora de voz: audio/mejora-voz.md
              - Configuración: audio/configuracion.md
            - Marca:
              - General: marca/index.md
              - Panel de marca: marca/panel-marca.md
              - Presets: marca/presets.md
            - Ajustes:
              - General: ajustes/index.md
              - Exportación: ajustes/exportacion.md
              - Generales: ajustes/generales.md
            - Procesamiento:
              - General: procesamiento/index.md
              - Cola de renderizado: procesamiento/cola-renderizado.md
            - Importar: importar.md
            - Redes sociales: redes-sociales.md
            - GIF: gif.md
            - Atajos: atajos.md
            - Licencia: licencia.md
            - Presets y respaldos: presets-respaldos.md
            - Solución de problemas: solucion-problemas.md
            - Notas técnicas: notas-tecnicas.md
        - locale: en
          name: English
          build: true
