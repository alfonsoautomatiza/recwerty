            - Installation:
              - Général: instalacion/index.md
              - Prérequis système: instalacion/requisitos.md
              - Installation: instalacion/instalacion.md
              - Premiers pas: instalacion/primeros-pasos.md
            - Interface:
              - Général: interfaz/index.md
